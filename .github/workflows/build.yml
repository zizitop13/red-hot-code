name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check verifyPlugin --info
      - name: Print test reports on failure
        if: failure()
        run: find build/test-results -name '*.xml' -type f -print -exec sed -n '1,240p' {} \;
